function load() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) Object.assign(state, JSON.parse(raw)); } catch(e){}
  if (state.activeWait) {
    proximityState[state.activeWait.paradaId] = { status:"waiting", startTime: state.activeWait.startTime, lastSeen: Date.now() };
  }
  if (!state.hayPublico) state.hayPublico = [];
}
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
function uid(p){ return `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`; }
function getAllParadas() { return [...PARADAS_CATALOGO, ...state.paradasUsuario]; }

/* ===================== Formato ===================== */
const euro = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const timeFmt = new Intl.DateTimeFormat("es-ES",{hour:"2-digit",minute:"2-digit"});
const dateTimeFmt = new Intl.DateTimeFormat("es-ES",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const formatEuro = n => euro.format(n||0);
const formatTime = ts => timeFmt.format(ts);
const formatDateTime = ts => dateTimeFmt.format(ts);
function formatDuration(totalSec){
  const s = Math.max(0, Math.floor(totalSec));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (h>0) return `${h}h ${String(m).padStart(2,"0")}m`;
  if (m>0) return `${m}m ${String(sec).padStart(2,"0")}s`;
  return `${sec}s`;
}
function startOfDay(ts=Date.now()){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function startOfWeek(ts=Date.now()){ const d=new Date(startOfDay(ts)); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getTime(); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ===================== Geo ===================== */
function distanceMeters(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

const PAGO_LABEL  = { efectivo:"Efectivo", tarjeta:"Tarjeta", app:"App" };
const GASTO_LABEL = { combustible:"Combustible", peaje:"Peaje", comida:"Comida", parking:"Parking", lavado:"Lavado", otros:"Otros" };

/* ===================== Hay Público (ntfy.sh) ===================== */
let sseConnection = null;
let fireMarkers = [];

function getCanal() { return (state.canalPublico || "taxidiario-x7k9m2p4q8w3v6n1").trim(); }

function notificarHayPublico() {
  if (!lastPosition) { showToast("⚠️ Necesito tu ubicación GPS"); return; }

  const cercanas = getAllParadas()
    .map(p => ({ p, d: distanceMeters(lastPosition.lat, lastPosition.lng, p.lat, p.lng) }))
    .sort((a,b) => a.d - b.d);
  const parada = cercanas[0] && cercanas[0].d < 300 ? cercanas[0].p : null;

  const msg = {
    type: "hayPublico",
    id: uid("hp"),
    lat: lastPosition.lat,
    lng: lastPosition.lng,
    paradaId: parada?.id || null,
    paradaNombre: parada?.nombre || null,
    usuario: state.conductor || "Taxi",
    ts: Date.now(),
  };

  addHayPublico(msg);

  fetch(`${NTFY_BASE}/${encodeURIComponent(getCanal())}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Title": "Hay público", "Priority": "high", "Tags": "fire" },
    body: JSON.stringify(msg),
  }).then(() => {
    showToast(`🔥 Aviso enviado${parada ? " en " + parada.nombre : ""}`);
  }).catch(() => {
    showToast("⚠️ No se pudo enviar (revisa conexión)");
  });
}

function addHayPublico(msg) {
  if (!state.hayPublico) state.hayPublico = [];
  if (state.hayPublico.find(a => a.id === msg.id)) return;
  state.hayPublico.push(msg);
  limpiarHayPublico();
  save();
  updateFireMarkers();
  updateTicker();
}

function limpiarHayPublico() {
  const now = Date.now();
  if (!state.hayPublico) state.hayPublico = [];

  const grupos = {};
  state.hayPublico.forEach(a => {
    const key = a.paradaId || `${a.lat.toFixed(3)}_${a.lng.toFixed(3)}`;
    (grupos[key] = grupos[key] || []).push(a);
  });

  const expirados = new Set();
  Object.values(grupos).forEach(items => {
    const recientes = items.filter(a => now - a.ts < HAY_PUBLICO_VENTANA_MS);
    const ttl = recientes.length >= HAY_PUBLICO_UMBRAL ? HAY_PUBLICO_TTL_MAX : HAY_PUBLICO_TTL_MIN;
    items.forEach(a => { if (now - a.ts > ttl) expirados.add(a.id); });
  });

  const antes = state.hayPublico.length;
  state.hayPublico = state.hayPublico.filter(a => !expirados.has(a.id));
  return antes !== state.hayPublico.length;
}

function updateFireMarkers() {
  if (!map) return;
  fireMarkers.forEach(m => { try { map.removeLayer(m); } catch(e){} });
  fireMarkers = [];

  const now = Date.now();
  state.hayPublico.forEach(a => {
    const icon = L.divIcon({
      className: "",
      html: `<div class="fire-icon">🔥</div>`,
      iconSize: [30,30], iconAnchor: [15,30],
    });
    const edad = Math.round((now - a.ts) / 1000);
    const marcador = L.marker([a.lat, a.lng], { icon, zIndexOffset: 500 }).addTo(map);
    marcador.bindPopup(`<div style="color:#111"><b>🔥 Hay público</b><br>${a.paradaNombre ? a.paradaNombre+"<br>" : ""}Hace ${edad}s${a.usuario ? " · "+esc(a.usuario) : ""}</div>`);
    fireMarkers.push(marcador);
  });
}

function updateTicker() {
  const el = document.getElementById("news-ticker");
  if (!el) return;
  if (!state.hayPublico || state.hayPublico.length === 0) {
    el.classList.add("hidden");
    el.innerHTML = "";
    return;
  }
  const sorted = [...state.hayPublico].sort((a,b) => b.ts - a.ts);
  const now = Date.now();
  const items = sorted.map(a => {
    const edad = Math.max(0, Math.round((now - a.ts) / 1000));
    const nombre = a.paradaNombre || "zona";
    const mins = edad < 60 ? `${edad}s` : `${Math.floor(edad/60)}m`;
    return `🔥 HAY PÚBLICO en ${nombre} (hace ${mins})`;
  });
  el.classList.remove("hidden");
  el.innerHTML = `<div class="ticker-track">${items.join("     •     ")}</div>`;
}

async function suscribirHayPublico() {
  try {
    const res = await fetch(`${NTFY_BASE}/${encodeURIComponent(getCanal())}/json?poll=1&since=30m`);
    const texto = await res.text();
    texto.trim().split("\n").filter(Boolean).forEach(line => {
      try {
        const data = JSON.parse(line);
        if (data.event === "message" && data.message) {
          const payload = JSON.parse(data.message);
          if (payload.type === "hayPublico") addHayPublico(payload);
        }
      } catch(e){}
    });
  } catch(e) { console.warn("No se pudieron cargar avisos recientes:", e); }

  if (sseConnection) { try { sseConnection.close(); } catch(e){} sseConnection = null; }
  try {
    sseConnection = new EventSource(`${NTFY_BASE}/${encodeURIComponent(getCanal())}/sse`);
    sseConnection.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.event === "message" && data.message) {
          const payload = JSON.parse(data.message);
          if (payload.type === "hayPublico") addHayPublico(payload);
        }
      } catch(err) {}
    };
    sseConnection.onerror = () => {};
  } catch(e) {
    console.warn("SSE no disponible:", e);
  }
}

function getJornadaData(jornada) {
  const svcs = state.services.filter(s => s.jornadaId === jornada.id);
  const gst  = state.gastos.filter(g => g.jornadaId === jornada.id);
  const ingresos = svcs.reduce((sum, s) => sum + s.importe + s.propina, 0);
  const gastosTot = gst.reduce((sum, g) => sum + g.importe, 0);
  const neto = ingresos - gastosTot;
  const media = svcs.length ? ingresos / svcs.length : 0;
  const duracion = ((jornada.endedAt ?? Date.now()) - jornada.startedAt) / 1000;
  const porHora = duracion > 0 ? ingresos / (duracion/3600) : 0;
  return { svcs, gst, ingresos, gastosTot, neto, media, duracion, porHora };
}

function initJornadaCharts() {
  destroyCharts();
  if (typeof Chart === "undefined") return;

  document.querySelectorAll('canvas[id^="chart-horas-"]').forEach(canvas => {
    const jornadaId = canvas.id.replace("chart-horas-","");
    const jornada = state.jornadas.find(j => j.id === jornadaId);
    if (!jornada) return;
    const d = getJornadaData(jornada);

    const startHour = new Date(jornada.startedAt).getHours();
    const endHour = new Date(jornada.endedAt ?? Date.now()).getHours();
    const horas = [];
    for (let h = startHour; h <= endHour; h++) horas.push(h);
    if (horas.length === 0) horas.push(startHour);

    const ingresosHora = horas.map(h =>
      d.svcs.filter(s => new Date(s.at).getHours() === h)
            .reduce((sum, s) => sum + s.importe + s.propina, 0)
    );
    const serviciosHora = horas.map(h =>
      d.svcs.filter(s => new Date(s.at).getHours() === h).length
    );

    const chart = new Chart(canvas, {
      type: "bar",
      data: {
        labels: horas.map(h => String(h).padStart(2,"0")+"h"),
        datasets: [{
          data: ingresosHora,
          backgroundColor: "#f5b400",
          borderRadius: 4,
          maxBarThickness: 34,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => {
            const n = serviciosHora[ctx.dataIndex];
            return [`${formatEuro(ctx.parsed.y)}`, `${n} servicio${n===1?"":"s"}`];
          }}}
        },
        scales: {
          x: { ticks: { color:"#888", font:{size:9} }, grid: { display:false } },
          y: { ticks: { color:"#888", font:{size:9}, callback: v => v+"€" }, grid: { color:"#222" }, beginAtZero: true }
        }
      }
    });
    activeCharts.push(chart);
  });

  document.querySelectorAll('canvas[id^="chart-gastos-"]').forEach(canvas => {
    const jornadaId = canvas.id.replace("chart-gastos-","");
    const jornada = state.jornadas.find(j => j.id === jornadaId);
    if (!jornada) return;
    const d = getJornadaData(jornada);
    if (d.gst.length === 0) return;

    const colores = { combustible:"#f5b400", peaje:"#3b82f6", comida:"#22c55e", parking:"#a855f7", lavado:"#06b6d4", otros:"#888" };
    const tipos = {};
    d.gst.forEach(g => { tipos[g.tipo] = (tipos[g.tipo]||0) + g.importe; });

    const chart = new Chart(canvas, {
      type: "doughnut",
      data: {
        labels: Object.keys(tipos).map(t => GASTO_LABEL[t] || t),
        datasets: [{
          data: Object.values(tipos),
          backgroundColor: Object.keys(tipos).map(t => colores[t] || "#888"),
          borderWidth: 0,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: "62%",
        plugins: {
          legend: { position:"bottom", labels: { color:"#ccc", font:{size:10}, boxWidth:12, padding:6 } },
          tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${formatEuro(ctx.parsed)}` } }
        }
      }
    });
    activeCharts.push(chart);
  });
}

/* ===================== Eventos ===================== */
function bindViewEvents() {
  root.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { state.view=b.dataset.go; save(); render(); }));

  if (state.view === "home") {
    const btn = document.getElementById("canal-save");
    if (btn) btn.addEventListener("click", () => {
      const nuevo = document.getElementById("canal-input").value.trim();
      if (!nuevo) { showToast("Pon un nombre de canal"); return; }
      state.canalPublico = nuevo;
      save();
      showToast(`📡 Canal: ${nuevo}`);
      suscribirHayPublico();
    });
  }

  if (state.view === "jornada") {
    const ini = document.getElementById("btn-ini-jornada");
    if (ini) ini.addEventListener("click", () => {
      const km = document.getElementById("kmInicio").value;
      const j = { id: uid("jor"), startedAt: Date.now(), kmInicio: km?Number(km):undefined, notas:"" };
      state.jornadas.unshift(j); state.jornadaActivaId = j.id; save(); render();
    });
    const fin = document.getElementById("btn-fin-jornada");
    if (fin) fin.addEventListener("click", () => {
      const km = document.getElementById("kmFin").value;
      const id = state.jornadaActivaId; if (!id) return;
      state.jornadas = state.jornadas.map(j => j.id===id ? { ...j, endedAt:Date.now(), kmFin: km?Number(km):j.kmFin } : j);
      state.jornadaActivaId = null; save(); render();
    });
    root.querySelectorAll("[data-toggle-jornada]").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.toggleJornada;
      state.expandedJornadaId = state.expandedJornadaId === id ? null : id;
      save(); render();
    }));
  }

  if (state.view === "servicios") {
    let pagoSel = "efectivo";
    root.querySelectorAll("#srv-pago-group [data-pago]").forEach(b => b.addEventListener("click", () => {
      pagoSel = b.dataset.pago;
      root.querySelectorAll("#srv-pago-group [data-pago]").forEach(x => {
        const a = x.dataset.pago === pagoSel;
        x.className = `flex-1 rounded-lg py-2 text-sm font-medium border ${a?"bg-brand-500 text-brand-900 border-brand-500":"bg-neutral-800 border-neutral-700 text-neutral-300"}`;
      });
    }));
    document.getElementById("btn-add-srv").addEventListener("click", () => {
      const importe = Number(document.getElementById("srv-importe").value)||0; if(!importe) return;
      state.services.unshift({
        id: uid("srv"), at: Date.now(),
        origen: document.getElementById("srv-origen").value.trim()||"—",
        destino: document.getElementById("srv-destino").value.trim()||"—",
        importe, propina: Number(document.getElementById("srv-propina").value)||0,
        pago: pagoSel, minutos:0,
        pasajeros: Number(document.getElementById("srv-pax").value)||1,
        notas:"", jornadaId: state.jornadaActivaId||undefined,
      });
      save(); render();
    });
    root.querySelectorAll("[data-del-srv]").forEach(b => b.addEventListener("click", () => {
      state.services = state.services.filter(s => s.id!==b.dataset.delSrv); save(); render();
    }));
  }

  if (state.view === "gastos") {
    let tipoSel = "combustible";
    root.querySelectorAll("#gasto-tipo-group [data-gasto]").forEach(b => b.addEventListener("click", () => {
      tipoSel = b.dataset.gasto;
      root.querySelectorAll("#gasto-tipo-group [data-gasto]").forEach(x => {
        const a = x.dataset.gasto === tipoSel;
        x.className = `rounded-lg py-2 text-xs font-medium border ${a?"bg-brand-500 text-brand-900 border-brand-500":"bg-neutral-800 border-neutral-700 text-neutral-300"}`;
      });
    }));
    document.getElementById("btn-add-gasto").addEventListener("click", () => {
      const importe = Number(document.getElementById("gasto-importe").value)||0; if(!importe) return;
      state.gastos.unshift({ id: uid("gst"), at: Date.now(), tipo:tipoSel, importe, notas:"", jornadaId: state.jornadaActivaId||undefined });
      save(); render();
    });
    root.querySelectorAll("[data-del-gasto]").forEach(b => b.addEventListener("click", () => {
      state.gastos = state.gastos.filter(g => g.id!==b.dataset.delGasto); save(); render();
    }));
  }

  if (state.view === "paradas") {
    document.getElementById("btn-add-parada").addEventListener("click", () => mostrarFormularioParada());
    document.getElementById("btn-centrar").addEventListener("click", () => {
      if (lastPosition && map) map.setView([lastPosition.lat, lastPosition.lng], 16);
      else initGeolocation(true);
    });

    const input = document.getElementById("paradas-q");
    const lista = document.getElementById("paradas-lista");
    const countEl = document.getElementById("paradas-count");
    const paint = (q="") => {
      const todas = getAllParadas();
      const conDist = todas.map(p => ({
        p,
        dist: lastPosition ? distanceMeters(lastPosition.lat, lastPosition.lng, p.lat, p.lng) : null,
      }));
      const cercanas = lastPosition ? conDist.filter(x => x.dist < NEARBY_RADIUS_M) : conDist;
      cercanas.sort((a,b) => (a.dist ?? 0) - (b.dist ?? 0));
      const filtradas = q
        ? cercanas.filter(x => `${x.p.nombre} ${x.p.barrio} ${x.p.municipio}`.toLowerCase().includes(q.toLowerCase()))
        : cercanas;

      if (countEl) countEl.textContent = `${filtradas.length} cerca`;

      lista.innerHTML = filtradas.length===0 ? `<p class="text-sm text-neutral-500">No hay paradas a menos de ${NEARBY_RADIUS_M/1000} km.</p>` :
        filtradas.map(({p, dist}) => {
          const st = proximityState[p.id];
          const activo = st && st.status === "waiting";
          const propia = state.paradasUsuario.some(x => x.id === p.id);
          const fuegosAqui = state.hayPublico.filter(a => a.paradaId === p.id).length;
          return `
            <div class="rounded-lg bg-neutral-900 border ${activo?"border-brand-500":"border-neutral-800"} p-3">
              <div class="flex justify-between items-start gap-2">
                <div class="flex-1">
                  <div class="font-medium flex items-center gap-2 flex-wrap">
                    ${activo?"⏱️ ":""}${esc(p.nombre)}
                    ${propia?`<span class="text-[10px] rounded-full bg-brand-500/20 text-brand-500 px-2 py-0.5">tuya</span>`:""}
                    ${fuegosAqui>0?`<span class="text-[10px] rounded-full bg-red-500/20 text-red-400 px-2 py-0.5">🔥 ${fuegosAqui}</span>`:""}
                  </div>
                  <div class="text-xs text-neutral-500 mt-0.5">${esc(p.barrio)}, ${esc(p.municipio)}${dist!=null?` · ${dist < 1000 ? Math.round(dist)+" m" : (dist/1000).toFixed(1)+" km"}`:""}</div>
                  <div class="text-xs text-neutral-500 mt-1">${p.plazas} plazas · ${esc(p.horario)}</div>
                </div>
                <div class="flex flex-col gap-1 items-end">
                  <button data-ir-parada="${p.id}" class="text-xs rounded-full bg-neutral-800 border border-neutral-700 px-3 py-1 text-brand-500">Ir</button>
                  ${propia?`<button data-del-parada="${p.id}" class="text-xs text-red-400">Borrar</button>`:""}
                </div>
              </div>
            </div>`;
        }).join("");

      lista.querySelectorAll("[data-ir-parada]").forEach(b => b.addEventListener("click", () => {
        const p = getAllParadas().find(x => x.id === b.dataset.irParada);
        if (p && map) { map.setView([p.lat, p.lng], 17); setTimeout(()=>map.invalidateSize(), 50); }
      }));
      lista.querySelectorAll("[data-del-parada]").forEach(b => b.addEventListener("click", () => {
        if (!confirm("¿Borrar esta parada que añadiste?")) return;
        state.paradasUsuario = state.paradasUsuario.filter(x => x.id !== b.dataset.delParada);
        save(); render();
      }));
    };
    paint();
    input.addEventListener("input", () => paint(input.value));
    renderParadaStats();
  }

  if (state.view === "dashboard") {
    let rango = "hoy";
    const el = document.getElementById("panel-stats");
    const paint = () => {
      const since = rango==="hoy"?startOfDay():rango==="semana"?startOfWeek():0;
      const svc = state.services.filter(s => s.at>=since);
      const gst = state.gastos.filter(g => g.at>=since);
      const ingresos = svc.reduce((s,x)=>s+x.importe+x.propina,0);
      const gastosTot = gst.reduce((s,x)=>s+x.importe,0);
      const neto = ingresos - gastosTot;
      const media = svc.length ? ingresos/svc.length : 0;
      const stat = (l,v,acc,full) => `<div class="rounded-xl bg-neutral-900 border border-neutral-800 p-4 ${full?"col-span-2":""}">
        <div class="text-xs text-neutral-500">${l}</div><div class="text-xl font-bold mt-1 ${acc?"text-brand-500":""}">${v}</div></div>`;
      el.innerHTML = stat("Ingresos",formatEuro(ingresos),true)+stat("Gastos",formatEuro(gastosTot))+
                     stat("Neto",formatEuro(neto),true)+stat("Servicios",String(svc.length))+
                     stat("Media/servicio",formatEuro(media),false,true);
    };
    paint();
    root.querySelectorAll("#rango-group [data-rango]").forEach(b => b.addEventListener("click", () => {
      rango = b.dataset.rango;
      root.querySelectorAll("#rango-group [data-rango]").forEach(x => {
        const a = x.dataset.rango === rango;
        x.className = `flex-1 rounded-lg py-2 text-sm font-medium border capitalize ${a?"bg-brand-500 text-brand-900 border-brand-500":"bg-neutral-800 border-neutral-700 text-neutral-300"}`;
      });
      paint();
    }));
  }
}

/* ===================== Formulario añadir parada ===================== */
function mostrarFormularioParada() {
  const modal = document.createElement("div");
  modal.id = "modal-add-parada";
  modal.className = "fixed inset-0 z-[9999] flex items-center justify-center bg-black/70 p-4";
  modal.innerHTML = `
    <div class="bg-neutral-900 border border-neutral-700 rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-bold">Añadir parada</h3>
      <div class="space-y-3">
        <input id="np-nombre" placeholder="Nombre de la parada *" class="w-full rounded-lg bg-neutral-800 border border-neutral-700 px-3 py-2 text-sm" />
        <input id="np-direccion" placeholder="Dirección (ej: Calle Mayor, 1)" class="w-full rounded-lg bg-neutral-800 border border-neutral-700 px-3 py-2 text-sm" />
        <input id="np-municipio" placeholder="Municipio" value="Madrid" class="w-full rounded-lg bg-neutral-800 border border-neutral-700 px-3 py-2 text-sm" />
        <div class="grid grid-cols-2 gap-2">
          <input id="np-plazas" placeholder="Plazas" inputmode="numeric" value="4" class="rounded-lg bg-neutral-800 border border-neutral-700 px-3 py-2 text-sm" />
          <input id="np-horario" placeholder="Horario" value="24h" class="rounded-lg bg-neutral-800 border border-neutral-700 px-3 py-2 text-sm" />
        </div>
        <p class="text-xs text-neutral-500">Coordenadas (se obtienen solas si buscas la dirección):</p>
        <div class="grid grid-cols-2 gap-2">
          <input id="np-lat" placeholder="Latitud" inputmode="decimal" class="rounded-lg bg-neutral-800 border border-neutral-700 px-3 py-2 text-sm" />
          <input id="np-lng" placeholder="Longitud" inputmode="decimal" class="rounded-lg bg-neutral-800 border border-neutral-700 px-3 py-2 text-sm" />
        </div>
        <button id="np-geocode" class="w-full rounded-lg bg-blue-600 hover:bg-blue-500 py-2 text-sm font-medium">🔍 Obtener coordenadas de la dirección</button>
      </div>
      <div class="flex gap-2">
        <button id="np-cancel" class="flex-1 rounded-lg bg-neutral-800 hover:bg-neutral-700 py-2 font-medium">Cancelar</button>
        <button id="np-save" class="flex-1 rounded-lg bg-brand-500 hover:bg-brand-400 text-brand-900 py-2 font-semibold">Guardar</button>
      </div>
      <p id="np-status" class="text-xs text-neutral-500 text-center min-h-[1rem]"></p>
    </div>`;
  document.body.appendChild(modal);

  const setStatus = (t) => { const el = document.getElementById("np-status"); if (el) el.textContent = t; };

  document.getElementById("np-cancel").addEventListener("click", () => modal.remove());

  document.getElementById("np-geocode").addEventListener("click", async () => {
    const dir = document.getElementById("np-direccion").value.trim();
    const mun = document.getElementById("np-municipio").value.trim();
    if (!dir) { setStatus("Escribe una dirección primero."); return; }
    setStatus("Buscando…");
    try {
      const q = encodeURIComponent(`${dir}, ${mun}, España`);
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`, { headers: { "Accept": "application/json" } });
      const data = await res.json();
      if (data && data.length > 0) {
        document.getElementById("np-lat").value = Number(data[0].lat).toFixed(6);
        document.getElementById("np-lng").value = Number(data[0].lon).toFixed(6);
        setStatus(`✅ ${data[0].display_name}`);
      } else {
        setStatus("⚠️ No se encontró. Prueba con 'Calle X, nº, municipio'.");
      }
    } catch (e) {
      setStatus("⚠️ Error al buscar. Revisa la conexión.");
    }
  });

  document.getElementById("np-save").addEventListener("click", () => {
    const nombre = document.getElementById("np-nombre").value.trim();
    const municipio = document.getElementById("np-municipio").value.trim() || "—";
    const barrio = document.getElementById("np-direccion").value.trim() || "—";
    const plazas = Number(document.getElementById("np-plazas").value) || 1;
    const horario = document.getElementById("np-horario").value.trim() || "24h";
    const lat = parseFloat(document.getElementById("np-lat").value);
    const lng = parseFloat(document.getElementById("np-lng").value);

    if (!nombre) { setStatus("El nombre es obligatorio."); return; }
    if (isNaN(lat) || isNaN(lng)) { setStatus("Faltan coordenadas. Pulsa 'Obtener coordenadas'."); return; }

    state.paradasUsuario.push({ id: uid("usr"), nombre, municipio, barrio, plazas, horario, lat, lng });
    save();
    modal.remove();
    showToast(`✅ "${nombre}" añadida`);
    render();
  });
}

/* ===================== Mapa ===================== */
function initMap() {
  const el = document.getElementById("map");
  if (!el) return;
  if (map) { try { map.remove(); } catch(e){} map = null; }
  paradaMarkers = {}; userMarker = null; userCircle = null;
  fireMarkers = [];

  const center = lastPosition ? [lastPosition.lat, lastPosition.lng] : [40.4168, -3.7038];
  try {
    map = L.map("map", { zoomControl:true }).setView(center, lastPosition ? 14 : 11);
  } catch(e) { console.error("Error creando mapa:", e); return; }
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: "abcd", maxZoom: 20,
  }).addTo(map);

  setTimeout(() => { if (map) map.invalidateSize(); }, 150);

  const todas = getAllParadas();
  const cercanas = lastPosition
    ? todas.filter(p => distanceMeters(lastPosition.lat, lastPosition.lng, p.lat, p.lng) < NEARBY_RADIUS_M)
    : todas;

  const paradaIcon = L.divIcon({
    className:"",
    html:`<div style="background:#f5b400;border:2px solid #1a1400;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 4px rgba(245,180,0,0.25)"></div>`,
    iconSize:[14,14], iconAnchor:[7,7],
  });
  cercanas.forEach(p => {
    paradaMarkers[p.id] = L.marker([p.lat, p.lng], { icon: paradaIcon })
      .addTo(map)
      .bindPopup(`<div style="color:#111"><b>${esc(p.nombre)}</b><br><span style="font-size:11px">${esc(p.barrio)} · ${p.plazas} plazas</span></div>`);
  });

  if (lastPosition) drawUser(lastPosition.lat, lastPosition.lng);
  updateFireMarkers();
  initGeolocation();
}

function refreshNearbyMarkers() {
  if (!map) return;
  const todas = getAllParadas();
  const cercanas = lastPosition
    ? todas.filter(p => distanceMeters(lastPosition.lat, lastPosition.lng, p.lat, p.lng) < NEARBY_RADIUS_M)
    : todas;
  const ids = new Set(cercanas.map(p => p.id));

  Object.keys(paradaMarkers).forEach(id => {
    if (!ids.has(id)) {
      try { map.removeLayer(paradaMarkers[id]); } catch(e){}
      delete paradaMarkers[id];
    }
  });

  const paradaIcon = L.divIcon({
    className:"",
    html:`<div style="background:#f5b400;border:2px solid #1a1400;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 4px rgba(245,180,0,0.25)"></div>`,
    iconSize:[14,14], iconAnchor:[7,7],
  });
  cercanas.forEach(p => {
    if (!paradaMarkers[p.id]) {
      paradaMarkers[p.id] = L.marker([p.lat, p.lng], { icon: paradaIcon })
        .addTo(map)
        .bindPopup(`<div style="color:#111"><b>${esc(p.nombre)}</b><br><span style="font-size:11px">${esc(p.barrio)} · ${p.plazas} plazas</span></div>`);
    }
  });
}

function drawUser(lat, lng) {
  if (!map) return;
  const userIcon = L.divIcon({
    className:"",
    html:`<div style="background:#3b82f6;border:3px solid white;width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 8px rgba(59,130,246,0.25)"></div>`,
    iconSize:[18,18], iconAnchor:[9,9],
  });
  if (!userMarker) userMarker = L.marker([lat,lng], { icon: userIcon }).addTo(map);
  else userMarker.setLatLng([lat,lng]);
  if (!userCircle) userCircle = L.circle([lat,lng], { radius: RADIO_PREGUNTAR, color:"#3b82f6", weight:1, fillColor:"#3b82f6", fillOpacity:0.08 }).addTo(map);
  else userCircle.setLatLng([lat,lng]);
}

/* ===================== Geolocalización ===================== */
function initGeolocation(force=false) {
  if (!navigator.geolocation) {
    const s = document.getElementById("geo-status"); if (s) s.textContent = "⚠️ Tu navegador no soporta geolocalización.";
    return;
  }
  if (watchId !== null && !force) return;
  watchId = navigator.geolocation.watchPosition(onPosition, onGeoError, {
    enableHighAccuracy: true, maximumAge: 5000, timeout: 20000,
  });
}
function onGeoError(err) {
  const s = document.getElementById("geo-status");
  const msg = err.code === 1 ? "Permiso de ubicación denegado." :
              err.code === 2 ? "Ubicación no disponible." :
              err.code === 3 ? "Tiempo de espera agotado." : err.message;
  if (s) s.textContent = `⚠️ ${msg}`;
}
function onPosition(pos) {
  const { latitude: lat, longitude: lng, accuracy } = pos.coords;
  const first = !lastPosition;
  lastPosition = { lat, lng, accuracy };
  drawUser(lat, lng);
  const s = document.getElementById("geo-status");
  if (s) s.textContent = `📍 Precisión ±${Math.round(accuracy)} m · ${formatTime(Date.now())}`;
  checkAllParadas(lat, lng);
  updateWaitingBanner();
  if (state.view === "paradas") {
    if (first && map) map.setView([lat, lng], 15);
    refreshNearbyMarkers();
    const input = document.getElementById("paradas-q");
    if (input) input.dispatchEvent(new Event("input"));
  }
}

/* ===================== Proximidad ===================== */
function checkAllParadas(lat, lng) {
  const now = Date.now();
  getAllParadas().forEach(p => {
    const d = distanceMeters(lat, lng, p.lat, p.lng);
    let st = proximityState[p.id];
    if (!st) st = proximityState[p.id] = { status:"idle", insideSince:null, anchor:null, lastSeen:null };

    if (st.lastSeen && now - st.lastSeen > RESET_SIN_VISITA_MS) {
      if (state.waitRecords && state.waitRecords[p.id]) state.waitRecords[p.id] = [];
      st = proximityState[p.id] = { status:"idle", insideSince:null, anchor:null, lastSeen:now };
    }
    st.lastSeen = now;

    if (st.status === "idle") {
      if (d < RADIO_PREGUNTAR) {
        if (!st.insideSince) { st.insideSince = now; st.anchor = { lat, lng }; }
        else {
          const moved = distanceMeters(st.anchor.lat, st.anchor.lng, lat, lng);
          if (moved > MOVIMIENTO_MAX_M) { st.insideSince = now; st.anchor = { lat, lng }; }
          else if (now - st.insideSince >= MIN_PARADO_SEGUNDOS * 1000) {
            st.status = "asking";
            askIfAtParada(p, d);
          }
        }
      } else { st.insideSince = null; st.anchor = null; }
    } else if (st.status === "waiting" && d > RADIO_TERMINAR) {
      finalizarEspera(p, st);
    } else if (st.status === "dismissed" && d > RADIO_PREGUNTAR + 30) {
      st.status = "idle"; st.insideSince = null; st.anchor = null;
    }
  });
}

function askIfAtParada(parada, dist) {
  if (document.getElementById("modal-parada")) return;
  if (state.activeWait) { proximityState[parada.id] = { status:"dismissed", lastSeen: Date.now() }; return; }

  const modal = document.createElement("div");
  modal.id = "modal-parada";
  modal.className = "fixed inset-0 z-[9999] flex items-center justify-center bg-black/70 p-4";
  modal.innerHTML = `
    <div class="bg-neutral-900 border border-neutral-700 rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
      <div>
        <div class="text-xs text-brand-500 font-semibold uppercase tracking-wide">📍 Cerca de una parada</div>
        <h3 class="text-lg font-bold mt-1">¿Estás en ${esc(parada.nombre)}?</h3>
        <p class="text-sm text-neutral-400 mt-1">Llevas 1 min parado a ${Math.round(dist)} m. Si confirmas, empiezo a contar tu espera.</p>
      </div>
      <div class="flex gap-2">
        <button id="modal-no" class="flex-1 rounded-lg bg-neutral-800 hover:bg-neutral-700 py-2 font-medium">No</button>
        <button id="modal-si" class="flex-1 rounded-lg bg-brand-500 hover:bg-brand-400 text-brand-900 py-2 font-semibold">Sí, estoy aquí</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  document.getElementById("modal-si").addEventListener("click", () => {
    const st = proximityState[parada.id];
    st.status = "waiting";
    st.startTime = Date.now();
    state.activeWait = { paradaId: parada.id, startTime: st.startTime };
    save(); modal.remove();
    if (state.view === "paradas") render(); else updateWaitingBanner();
  });
  document.getElementById("modal-no").addEventListener("click", () => {
    proximityState[parada.id] = { status:"dismissed", lastSeen: Date.now() };
    modal.remove();
  });
}

function finalizarEspera(parada, st) {
  const endTime = Date.now();
  const duration = (endTime - st.startTime) / 1000;
  st.status = "dismissed"; st.startTime = null;
  state.activeWait = null;

  if (duration < MIN_DURACION_ESPERA) { save(); updateWaitingBanner(); return; }

  if (!state.waitRecords) state.waitRecords = {};
  if (!state.waitRecords[parada.id]) state.waitRecords[parada.id] = [];
  state.waitRecords[parada.id].push({ start: st.startTime, end: endTime, duration });
  if (state.waitRecords[parada.id].length > 500) state.waitRecords[parada.id] = state.waitRecords[parada.id].slice(-500);
  save();
  showToast(`✅ Espera en ${parada.nombre}: ${formatDuration(duration)}`);
  if (state.view === "paradas") render(); else updateWaitingBanner();
}

/* ===================== Banner y toast ===================== */
function updateWaitingBanner() {
  const el = document.getElementById("waiting-banner");
  if (!el) return;
  if (!state.activeWait) { el.classList.add("hidden"); el.innerHTML = ""; return; }
  const p = getAllParadas().find(x => x.id === state.activeWait.paradaId);
  if (!p) { el.classList.add("hidden"); return; }
  const secs = (Date.now() - state.activeWait.startTime) / 1000;
  el.className = "fixed top-0 left-0 right-0 max-w-md mx-auto z-[500] bg-brand-500 text-brand-900 px-4 py-2 flex items-center justify-between text-sm font-semibold shadow-lg";
  el.innerHTML = `<span>⏱️ Esperando en ${esc(p.nombre)}</span><span class="font-mono">${formatDuration(secs)}</span>`;
}

function showToast(msg) {
  const t = document.createElement("div");
  t.className = "fixed bottom-24 left-1/2 -translate-x-1/2 z-[9999] bg-neutral-800 border border-neutral-700 text-sm px-4 py-2 rounded-full shadow-lg max-w-[90%] text-center";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

/* ===================== Estadísticas por parada ===================== */
function renderParadaStats() {
  const el = document.getElementById("parada-stats");
  if (!el) return;
  const records = state.waitRecords || {};
  const ids = Object.keys(records).filter(id => (records[id]||[]).length > 0);
  if (ids.length === 0) { el.innerHTML = ""; return; }
  const todas = getAllParadas();

  el.innerHTML = `
    <h3 class="text-sm font-semibold text-neutral-400 mt-2">Tus estadísticas de espera</h3>
    ${ids.map(id => {
      const p = todas.find(x => x.id === id); if (!p) return "";
      const list = records[id];
      const durs = list.map(r => r.duration);
      const avg = durs.reduce((a,b)=>a+b,0) / durs.length;
      const min = Math.min(...durs), max = Math.max(...durs);
      const last = list[list.length-1];
      return `
        <div class="rounded-lg bg-neutral-900 border border-neutral-800 p-3 space-y-1">
          <div class="flex justify-between items-start">
            <div>
              <div class="font-medium">${esc(p.nombre)}</div>
              <div class="text-xs text-neutral-500">${list.length} ${list.length===1?"visita":"visitas"}</div>
            </div>
            <button data-reset="${id}" class="text-xs text-red-400">Borrar</button>
          </div>
          <div class="grid grid-cols-3 gap-2 pt-2 text-center">
            <div><div class="text-[10px] text-neutral-500">MEDIA</div><div class="text-sm font-semibold text-brand-500">${formatDuration(avg)}</div></div>
            <div><div class="text-[10px] text-neutral-500">MÍN</div><div class="text-sm font-semibold">${formatDuration(min)}</div></div>
            <div><div class="text-[10px] text-neutral-500">MÁX</div><div class="text-sm font-semibold">${formatDuration(max)}</div></div>
          </div>
          <div class="text-[11px] text-neutral-500 pt-1">Última: ${formatDateTime(last.end)}</div>
        </div>`;
    }).join("")}
  `;
  el.querySelectorAll("[data-reset]").forEach(b => b.addEventListener("click", () => {
    if (!confirm("¿Borrar el historial de esperas de esta parada?")) return;
    delete state.waitRecords[b.dataset.reset];
    save(); renderParadaStats();
  }));
}

/* ===================== Tick ===================== */
setInterval(() => {
  if (state.view === "jornada" && state.jornadaActivaId) {
    const a = state.jornadas.find(j => j.id === state.jornadaActivaId);
    const el = document.getElementById("cronometro");
    if (a && el) el.textContent = formatDuration((Date.now()-a.startedAt)/1000);
  }
  if (state.activeWait) updateWaitingBanner();

  const now = Date.now();
  let changed = false;
  Object.keys(proximityState).forEach(id => {
    const st = proximityState[id];
    if (st.lastSeen && now - st.lastSeen > RESET_SIN_VISITA_MS) {
      delete proximityState[id];
      if (state.waitRecords && state.waitRecords[id] && state.waitRecords[id].length) { state.waitRecords[id] = []; changed = true; }
    }
  });
  if (changed) { save(); if (state.view === "paradas") renderParadaStats(); }

  if (Math.floor(now/1000) % 5 === 0) {
    const huboCambios = limpiarHayPublico();
    if (huboCambios) save();
    if (state.view === "paradas" && map) updateFireMarkers();
    updateTicker();
  }
}, 1000);

/* ===================== Arranque ===================== */
load();
render();
initGeolocation();
suscribirHayPublico();
</script>
</body>
</html>
